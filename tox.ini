[tox]
skipsdist = True
envlist = flake8, unit

[testenv:flake8]
basepython = python3
commands = flake8 {posargs}
deps = flake8

[testenv:unit]
basepython = python3
deps = pyyaml
changedir = xmldumps-backup
commands = python -m unittest discover -s test -p '*_test.py' -t .

[flake8]
exclude=.tox,wikiqueries,unused,incrementals
# E731 do not assign a lambda expression, use a def
# F841 local variable 'xxx' is assigned to but never used
ignore = E731,F841,W504
max-line-length = 105
per-file-ignores =
    xmldumps-backup/sample_scripts/*: E402
